name: Build Windows Installer

run-name: Central Docs Windows installer v${{ inputs.version }} with frontend ${{ inputs.frontend_ref }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: MSI application version
        required: true
        default: 1.0.0
        type: string
      frontend_ref:
        description: Branch, tag, or commit from doc-central-forms
        required: true
        default: main
        type: string
      publish_release:
        description: Publish the MSI and checksum as a GitHub Release
        required: true
        default: true
        type: boolean
      request_id:
        description: Correlation ID used by Linux downloads
        required: false
        default: manual
        type: string
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package-msi:
    runs-on: windows-2022

    steps:
      - name: Check out desktop backend
        uses: actions/checkout@v6
        with:
          path: doc-central-app

      - name: Check out React frontend
        id: frontend-checkout
        uses: actions/checkout@v6
        with:
          repository: TheAlexBig/doc-central-forms
          ref: ${{ inputs.frontend_ref }}
          path: doc-central-forms

      - name: Validate release version and record source revisions
        id: source
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ inputs.version }}
        run: |
          if ($env:INSTALLER_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use the numeric format 1.2.3."
          }

          [xml]$pom = Get-Content '.\doc-central-app\pom.xml'
          $backendVersion = $pom.project.version
          $frontendPackage = Get-Content '.\doc-central-forms\package.json' |
            ConvertFrom-Json
          $frontendVersion = $frontendPackage.version

          if ($backendVersion -ne $env:INSTALLER_VERSION) {
            throw "Backend version $backendVersion does not match installer version $env:INSTALLER_VERSION."
          }
          if ($frontendVersion -ne $env:INSTALLER_VERSION) {
            throw "Frontend version $frontendVersion does not match installer version $env:INSTALLER_VERSION."
          }

          $backendSha = git -C .\doc-central-app rev-parse HEAD
          $frontendSha = git -C .\doc-central-forms rev-parse HEAD
          "backend_sha=$backendSha" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "frontend_sha=$frontendSha" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doc-central-forms/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: doc-central-app/pom.xml

      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v*\bin" |
              Select-Object -Last 1 -ExpandProperty FullName
            $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build MSI with jpackage
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ inputs.version }}
        run: |
          .\doc-central-app\packaging\windows\build-installer.ps1 `
            -Version $env:INSTALLER_VERSION `
            -FrontendDirectory (Resolve-Path '.\doc-central-forms').Path

      - name: Prepare release assets and checksum
        id: release-assets
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ inputs.version }}
          BACKEND_SHA: ${{ steps.source.outputs.backend_sha }}
          FRONTEND_SHA: ${{ steps.source.outputs.frontend_sha }}
        run: |
          $installerDirectory = Resolve-Path '.\doc-central-app\target\installer'
          $msi = Get-ChildItem $installerDirectory -Filter '*.msi' -File
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI, found $($msi.Count)."
          }

          $releaseMsi = Join-Path $installerDirectory "Central.Docs-$env:INSTALLER_VERSION.msi"
          if ($msi.FullName -ne $releaseMsi) {
            Move-Item -Force $msi.FullName $releaseMsi
          }
          $hash = (Get-FileHash $releaseMsi -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Join-Path $installerDirectory 'SHA256SUMS.txt'
          "$hash  $(Split-Path $releaseMsi -Leaf)" |
            Set-Content $checksum -Encoding ascii

          $notes = Join-Path $installerDirectory 'release-notes.md'
          @"
          ## Instalador

          Esta versión incluye el instalador MSI para Windows y su checksum SHA-256.

          ## Procedencia de la compilación

          - Backend: ``$env:BACKEND_SHA``
          - Frontend: ``$env:FRONTEND_SHA``
          - GitHub Actions: run ``${{ github.run_id }}``
          - El MSI recibe una attestación de procedencia de GitHub antes de publicarse.

          ## Verificación

          Descargue ambos archivos y ejecute:

          ``````powershell
          Get-FileHash .\Central.Docs-$env:INSTALLER_VERSION.msi -Algorithm SHA256
          ``````

          Compare el resultado con ``SHA256SUMS.txt``.

          ## Firma de Windows

          Mientras la integración con SignPath Foundation no esté activa, el MSI no
          tendrá firma Authenticode y Windows todavía podrá mostrar ``Unknown publisher``.
          "@ | Set-Content $notes -Encoding utf8

          "msi=$releaseMsi" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum=$checksum" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes=$notes" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attest Windows installer provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.release-assets.outputs.msi }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: central-docs-windows-msi-${{ inputs.version }}
          path: |
            ${{ steps.release-assets.outputs.msi }}
            ${{ steps.release-assets.outputs.checksum }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_VERSION: ${{ inputs.version }}
          MSI_PATH: ${{ steps.release-assets.outputs.msi }}
          CHECKSUM_PATH: ${{ steps.release-assets.outputs.checksum }}
          NOTES_PATH: ${{ steps.release-assets.outputs.notes }}
        run: |
          $tag = "v$env:INSTALLER_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Increment the version before publishing."
          }

          gh release create $tag `
            "$env:MSI_PATH#Instalador MSI para Windows" `
            "$env:CHECKSUM_PATH#Checksum SHA-256" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Central Docs $tag" `
            --notes-file $env:NOTES_PATH
